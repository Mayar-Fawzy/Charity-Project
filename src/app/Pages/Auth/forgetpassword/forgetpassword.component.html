<section class="login-container" *ngIf="step1">
    <div class="login-modal">
      <div class="modal-header">
        <h2 class="fw-bold">نسيت كلمة المرور</h2>
        <button class="close-btn" routerLink="/login">
          <i class="fa-solid fa-xmark fs-5"></i>
        </button>
      </div>
  
      <form (ngSubmit)="handelforgetpassword()" [formGroup]="forgetpasswordform">
        <div class="form-group mt-3">
          <div class="input-group">
            <label for="email" class="mb-3">البريد الالكتروني</label>
            <input type="email" class="form-control inps" id="email" formControlName="email" placeholder="ادخل البريد الالكتروني" />
            <div class="input-icon">
              <i class="fa fa-user"></i>
            </div>
          </div>
          <div *ngIf="forgetpasswordform.get('email')?.errors && forgetpasswordform.get('email')?.touched" class="text-danger mt-1">
            <span *ngIf="forgetpasswordform.get('email')?.errors?.['required']">الايميل مطلوب</span>
            <span *ngIf="forgetpasswordform.get('email')?.errors?.['email']">الايميل غير صالح</span>
          </div>
          <span class="text-danger mt-1">{{ message }}</span>
        </div>
  
        <button class="login-btn" [disabled]="!forgetpasswordform.valid || isloading" type="submit">
          <span *ngIf="!isloading">تأكيد</span>
          <span *ngIf="isloading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span *ngIf="isloading">جاري التحميل...</span>
        </button>
  
        <div class="register-link" routerLink="/login">
          <span>ليس لديك حساب؟ </span>
          <a>أنشيء حساب جديد</a>
        </div>
      </form>
    </div>
  </section>
  
  <section class="login-container" *ngIf="step2">
    <div class="login-modal">
      <div class="modal-header">
        <h2 class="fw-bold">كود التفعيل</h2>
        <button class="close-btn" routerLink="/login">
            <i class="fa-solid fa-xmark fs-5"></i>
          </button>
      </div>
  
      <form (ngSubmit)="hanelResetCode()" [formGroup]="ResetCodeform">
        <div class="form-group mt-3">
          <label for="Code" class="mb-3">الكود</label>
          <input type="tel" class="form-control inps inpTel" id="Code" formControlName="resetCode" />
          <div *ngIf="ResetCodeform.get('resetCode')?.errors && ResetCodeform.get('resetCode')?.touched" class="text-danger mt-1">
            <span *ngIf="ResetCodeform.get('resetCode')?.errors?.['required']">الكود مطلوب</span>
          </div>
          <span class="text-danger mt-1">{{ message }}</span>
        </div>
  
        <button class="login-btn" [disabled]="!ResetCodeform.valid || isloading" type="submit">
          <span *ngIf="!isloading">تأكيد</span>
          <span *ngIf="isloading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span *ngIf="isloading">جاري التحميل...</span>
        </button>
      </form>
    </div>
  </section>
  
  <section class="login-container" *ngIf="step3">
    <div class="login-modal">
      <div class="modal-header">
        <h2 class="fw-bold">كلمة المرور الجديدة</h2>
        <button class="close-btn" routerLink="/login">
            <i class="fa-solid fa-xmark fs-5"></i>
          </button>
      </div>
  
      <form (ngSubmit)="handelnewPassword()" [formGroup]="newPasswordform">
        <div class="form-group mt-3">
          <label for="email" class="mb-3">البريد الالكتروني</label>
          <input type="email" class="form-control inps" id="email" formControlName="email" placeholder="ادخل البريد الالكتروني" />
          <!-- <div class="emailIcon">
            <i class="fa fa-user"></i>
          </div> -->
          <div *ngIf="newPasswordform.get('email')?.errors && newPasswordform.get('email')?.touched" class="text-danger mt-1">
            <span *ngIf="newPasswordform.get('email')?.errors?.['required']">الايميل مطلوب</span>
            <span *ngIf="newPasswordform.get('email')?.errors?.['email']">الايميل غير صالح</span>
          </div>
        </div>
  
        <div class="form-group mt-3">
          <label for="password" class="mb-3">كلمة المرور الجديدة</label>
          <input type="password" class="form-control inps" id="password" formControlName="newPassword" placeholder="ادخل كلمة المرور الجديدة" />
          <!-- <div class="passIcon">
            <i class="fa fa-lock"></i>
        </div> -->
          <div *ngIf="newPasswordform.get('newPassword')?.errors && newPasswordform.get('newPassword')?.touched" class="text-danger mt-1">
            <span *ngIf="newPasswordform.get('newPassword')?.errors?.['required']">كلمة المرور مطلوبة</span>
            <span *ngIf="newPasswordform.get('newPassword')?.errors?.['pattern']">كلمة المرور غير صالحة</span>
          </div>
        </div>
  
        <button class="login-btn" [disabled]="!newPasswordform.valid || isloading" type="submit">
          <span *ngIf="!isloading">تأكيد</span>
          <span *ngIf="isloading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span *ngIf="isloading">جاري التحميل...</span>
        </button>
      </form>
    </div>
  </section>
