<div class="admin-layout d-flex">
  <!-- Sidebar -->
  <aside class="sidebar p-3" [class.closed]="!sidebarOpen">
    <div class="toggle-btn mb-3 text-end">
      <button class="btn btn-outline-light" (click)="toggleSidebar()">
        <i
          class="bi"
          [ngClass]="sidebarOpen ? 'bi-chevron-left' : 'bi-chevron-right'"
        ></i>
      </button>
    </div>

    <ul class="nav flex-column text-end">
      <li class="nav-item mb-2">
        <a routerLink="overview" routerLinkActive="active" class="nav-link">
          <i class="bi bi-house-door"></i>
          <span *ngIf="sidebarOpen">نظرة عامة</span>
        </a>
      </li>
      <li class="nav-item mb-2">
        <a
          routerLink="help-requests"
          routerLinkActive="active"
          class="nav-link"
        >
          <i class="bi bi-life-preserver"></i>
          <span *ngIf="sidebarOpen">طلبات المساعدة</span>
        </a>
      </li>
      <li class="nav-item mb-2">
        <a
          routerLink="item-donations"
          routerLinkActive="active"
          class="nav-link"
        >
          <i class="bi bi-box-seam"></i>
          <span *ngIf="sidebarOpen">تبرعات عينية</span>
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="projects" routerLinkActive="active" class="nav-link">
          <i class="bi bi-kanban"></i>
          <span *ngIf="sidebarOpen">المشاريع</span>
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="volunteers" routerLinkActive="active" class="nav-link">
          <i class="bi bi-people"></i>
          <span *ngIf="sidebarOpen">المتطوعين</span>
        </a>
      </li>
    </ul>
  </aside>

  <!-- Main Content -->
  <div class="main-content flex-grow-1">
    <header
      class="navbar p-3 bg-white border-bottom d-flex justify-content-between align-items-center"
    >
      <div class="navbar__brand">
        <span>يـــــــد</span>
        <img src="/Images/Logo.svg" alt="Logo" class="navbar__logo" />
        <span>العطاء</span>
      </div>
      <h5 class="mb-0 logo-text">أحمد</h5>
    </header>

    <div class="p-3">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
