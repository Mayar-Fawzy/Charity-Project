<section class="container my-4 text-end">
  <button class="btn btn-warning mb-4" (click)="openAddModal(projectModal)">
    <i class="bi bi-plus-circle"></i> إضافة مشروع
  </button>

  <div class="row g-3">
    <div class="col-md-6 col-lg-4" *ngFor="let project of projects">
      <div class="card h-100 shadow-sm">
        <img [src]="project.image" class="card-img-top" alt="Project Image" />
        <div class="card-body text-end">
          <h5 class="card-title">{{ project.title }}</h5>
          <p class="card-text">{{ project.description }}</p>
          <div class="progress mb-2">
            <div
              class="progress-bar"
              role="progressbar"
              [style.width.%]="project.progress"
            >
              {{ project.progress }}%
            </div>
          </div>
          <p class="mb-2">الهدف: {{ project.goal | number }}</p>
          <div class="d-flex justify-content-between">
            <button
              class="btn btn-outline-primary btn-sm"
              (click)="openEditModal(project, projectModal)"
            >
              <i class="bi bi-pencil-square"></i> تحديث
            </button>
            <button
              class="btn btn-outline-danger btn-sm"
              (click)="deleteProject(project)"
            >
              <i class="bi bi-trash"></i> حذف
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Template -->
  <ng-template #projectModal let-modal>
    <div class="modal-header justify-content-between">
      <h5 class="modal-title ms-auto">
        {{ selectedProject ? "تحديث مشروع" : "إضافة مشروع" }}
      </h5>

      <button
        type="button"
        class="btn-close me-auto"
        aria-label="Close"
        (click)="modal.dismiss()"
      ></button>
    </div>
    <div class="modal-body">
      <form action="">
        <div class="mb-3">
          <label class="form-label section-title">
            <i class="bi bi-highlighter"></i> عنوان المشروع
          </label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="projectForm.title"
            name="title"
          />
        </div>

        <div class="mb-3">
          <label class="form-label section-title">
            <i class="bi bi-card-text"></i> وصف المشروع
          </label>
          <textarea
            class="form-control"
            [(ngModel)]="projectForm.description"
            name="description"
          ></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label section-title">
            <i class="bi bi-bullseye"></i> الهدف
          </label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="projectForm.goal"
            name="goal"
          />
        </div>

        <div class="mb-3">
          <label class="form-label section-title">
            <i class="bi bi-image"></i> صورة المشروع
          </label>
          <input
            type="file"
            class="form-control"
            (change)="onImageSelected($event)"
          />
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="modal.dismiss()">إلغاء</button>
      <button class="btn btn-success" (click)="saveProject(modal)">
        <i class="bi bi-check-circle"></i> حفظ
      </button>
    </div>
  </ng-template>
</section>
