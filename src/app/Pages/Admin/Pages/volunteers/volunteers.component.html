<div class="container mt-4">
   <!-- Main Tabs -->
  <ul class="nav nav-tabs custom-tabs justify-content-start mb-3">
    <li class="nav-item">
      <button
        class="nav-link"
        [class.active]="selectedType === 'projects'"
        (click)="onTypeChange('projects')"
      >
        تطوعات المشاريع
      </button>
    </li>
    <li class="nav-item">
      <button
        class="nav-link"
        [class.active]="selectedType === 'activities'"
        (click)="onTypeChange('activities')"
      >
        تطوعات الأنشطة
      </button>
    </li>
  </ul>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="text-center my-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">جاري التحميل...</span>
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>

  <!-- Tabs -->
  <div class="tab-content mb-4" *ngIf="!isLoading">
    <ul class="nav nav-tabs custom-tabs justify-content-center">
      <li class="nav-item" *ngFor="let tab of tabs">
        <button
          class="nav-link"
          [class.active]="selectedTab === tab.value"
          (click)="onTabChange(tab.value)"
        >
          {{ tab.label }}
        </button>
      </li>
    </ul>
  </div>

  <!-- Volunteers -->
  <div class="row" *ngIf="!isLoading">
    <div class="col-md-6 col-lg-4 mb-4" *ngFor="let volunteer of filteredVolunteers">
      <div class="card h-100 shadow-sm custom-volunteer-card">
        <div class="text-center mt-3">
          <img
            [src]="volunteer.imageUrl"
            alt="صورة المتطوع"
            class="rounded-circle avatar-img"
            (click)="openImage(volunteer.imageUrl)"
          />
        </div>

        <div class="card-body">
          <h5 class="card-title text-center mb-3">{{ volunteer.name || 'غير معروف' }}</h5>

          <div class="form-group mb-2">
            <label>البريد:</label>
            <input type="text" class="form-control" [value]="volunteer.email || 'غير متوفر'" readonly />
          </div>

          <div class="row mb-2">
            <div class="col-6">
              <label>رقم الهاتف:</label>
              <input type="text" class="form-control" [value]="volunteer.phone || 'غير متوفر'" readonly />
            </div>
            <div class="col-6">
             <label>الجنس:</label>
              <input
                type="text"
                class="form-control"
              [value]="volunteer.gender === 0 ? 'ذكر' : (volunteer.gender === 1 ? 'أنثى' : 'غير محدد')"
                readonly
              />
            </div>
          </div>

          <div class="form-group mb-2">
            <label>عنوان المشروع:</label>
            <input type="text" class="form-control" [value]="volunteer.projectAddress || 'غير متوفر'" readonly />
          </div>

          <div class="form-group mb-3">
            <label>وصف المشروع:</label>
            <textarea class="form-control" rows="2" [value]="volunteer.projectDescription || 'غير متوفر'" readonly></textarea>
          </div>

          <div class="form-group mb-3">
            <label>تاريخ التقديم:</label>
            <input type="text" class="form-control" [value]="volunteer.createdDate ? (volunteer.createdDate | date:'yyyy-MM-dd') : 'غير متوفر'" readonly />
          </div>
        </div>

        <div class="card-footer bg-transparent border-0 d-flex justify-content-between gap-2">
          <button class="btn btn-accept w-100" (click)="acceptVolunteer(volunteer)">إضافة</button>
          <button class="btn btn-reject w-100" (click)="rejectVolunteer(volunteer)">رفض</button>
          <button class="btn btn-contact w-100" (click)="contactVolunteer(volunteer)">تواصل</button>
        </div>
      </div>
    </div>

    <div class="col-12 text-center" *ngIf="filteredVolunteers.length === 0 && !isLoading">
      <p>لا توجد بيانات لعرضها.</p>
    </div>
  </div>

  <!-- Pagination -->
  <nav aria-label="Page navigation" *ngIf="totalPages > 1 && !isLoading">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="changePage(currentPage - 1)">السابق</button>
      </li>
      <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index" [class.active]="currentPage === i + 1">
        <button class="page-link" (click)="changePage(i + 1)">{{ i + 1 }}</button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="changePage(currentPage + 1)">التالي</button>
      </li>
    </ul>
  </nav>

  <!-- Image Modal -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center">
        <div class="modal-header">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="closeImageModal()"></button>
        </div>
        <div class="modal-body p-0">
          <img [src]="selectedImage" class="img-fluid rounded" />
        </div>
      </div>
    </div>
  </div>
</div>
