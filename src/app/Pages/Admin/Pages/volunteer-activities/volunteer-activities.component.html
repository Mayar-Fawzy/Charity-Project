<section class="container my-2 text-end">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <button class="btn btn-warning" (click)="openAddModal(activityModal)">
      <i class="bi bi-plus-circle"></i> إضافة نشاط تطوعي
    </button>

    <!-- Pagination -->
    <nav class="pagination-wrapper" *ngIf="totalPages > 1">
      <ul class="pagination justify-content-center">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button
            class="page-link"
            (click)="goToPrevious()"
            [disabled]="currentPage === 1"
          >
            <!-- Adjusted for RTL: "Previous" uses right chevron -->
            <i class="bi bi-chevron-right"></i>
          </button>
        </li>
        <li class="page-item dots" *ngIf="showLeftDots">
          <span class="page-link">...</span>
        </li>
        <li
          class="page-item"
          *ngFor="let page of displayedPages"
          [class.active]="currentPage === page"
        >
          <button class="page-link" (click)="goToPage(page)">{{ page }}</button>
        </li>
        <li class="page-item dots" *ngIf="showRightDots">
          <span class="page-link">...</span>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button
            class="page-link"
            (click)="goToNext()"
            [disabled]="currentPage === totalPages"
          >
            <!-- Adjusted for RTL: "Next" uses left chevron -->
            <i class="bi bi-chevron-left"></i>
          </button>
        </li>
      </ul>
    </nav>

    <div class="d-flex align-items-center gap-2">
      <label for="sortSelect" class="form-label mb-0">ترتيب حسب:</label>
      <select
        id="sortSelect"
        class="form-select form-select-sm w-auto"
        [(ngModel)]="sortOrder"
        (change)="sortActivities()"
      >
        <option value="newest">الأحدث</option>
        <option value="oldest">الأقدم</option>
      </select>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6 col-lg-4" *ngFor="let activity of volunteerActivities">
      <div class="card h-100 shadow-sm p-3 text-end">
        <h5 class="fw-bold text-warning mb-2">{{ activity.name }}</h5>

        <p class="text-muted">
          {{ activity.activityDescription }}
        </p>

        <div class="bg-light border border-warning-subtle p-2 rounded mb-3 small">
          <i class="bi bi-calendar-plus text-dark ms-1"></i>
          تاريخ الإنشاء: {{ activity.createdDate | date: "dd-MM-yyyy" }}
        </div>

        <div class="d-flex justify-content-between">
          <button
            class="btn btn-outline-primary btn-sm"
            (click)="openEditModal(activity, activityModal)"
          >
            <i class="bi bi-pencil-square"></i> تحديث
          </button>
          <button
            class="btn btn-outline-danger btn-sm"
            (click)="deleteActivity(activity.id)"
          >
            <i class="bi bi-trash"></i> حذف
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Template for Adding/Editing Activity -->
  <ng-template #activityModal let-modal>
    <div class="modal-header justify-content-between">
      <h5 class="modal-title ms-auto">
        {{ selectedActivity ? "تحديث نشاط" : "إضافة نشاط تطوعي" }}
      </h5>
      <button
        type="button"
        class="btn-close me-auto"
        aria-label="Close"
        (click)="modal.dismiss()"
      ></button>
    </div>

    <div class="modal-body">
      <form>
        <div class="mb-3">
          <label class="form-label">عنوان النشاط</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="activityForm.name"
            name="name"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">الوصف</label>
          <textarea
            class="form-control"
            [(ngModel)]="activityForm.activityDescription"
            name="activityDescription"
            required
          ></textarea>
        </div>
      </form>
    </div>
<div class="modal-footer">
  <button class="btn btn-secondary" (click)="modal.dismiss()">إلغاء</button>
  <!-- trim=>Ensures the name & activityDescription field is not empty or just whitespace -->
  <button
    class="btn btn-success"
    [disabled]="isLoading || !activityForm.name?.trim() || !activityForm.activityDescription?.trim()"
    (click)="saveActivity(modal)"
  >  @if(!isLoading) {
              <span><i class="bi bi-check-circle"></i> حفظ</span>
            } @else {
              <span>حفظ...</span>
            }
  </button>
</div>
  </ng-template>
</section>
