<nav class="navbar" [ngClass]="{ hidden: isNavbarHidden, open: isMenuOpen }">
  <div class="navbar__container">
    <!-- Mobile Button -->
    <button class="navbar__toggle" (click)="toggleMenu()" *ngIf="isSmallScreen">
      <i class="bi bi-list"></i>
    </button>

    <!-- Logo -->
    <div class="navbar__brand">
      <span>يـــــــد</span>
      <img src="/Images/Logo.svg" alt="Logo" class="navbar__logo" />
      <span>العطاء</span>
    </div>

    <!-- Nav Menu -->
    <ul class="navbar__menu" [class.open]="isMenuOpen">
      <li>
        <a routerLink="/home" routerLinkActive="active" (click)="closeMenu()"
          >الرئيسية</a
        >
      </li>
      <li>
        <a
          routerLink="/volunteer"
          routerLinkActive="active"
          (click)="closeMenu()"
          >التطوعات</a
        >
      </li>
      <li>
        <a routerLink="/donor" routerLinkActive="active" (click)="closeMenu()"
          >التبرعات</a
        >
      </li>
      <li>
        <a
          routerLink="/projects"
          routerLinkActive="active"
          (click)="closeMenu()"
          >المشاريع</a
        >
      </li>
      <li>
        <a routerLink="/request" routerLinkActive="active" (click)="closeMenu()"
          >المساعدات</a
        >
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()"
          >من نحن</a
        >
      </li>
      <li>
        <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()"
          >تواصل معنا</a
        >
      </li>

      <!-- Mobile User Section -->
      <li
        *ngIf="isSmallScreen"
        class="mobile-user-section"
        (click)="closeMenu()"
      >
        <ng-container *ngIf="!isLogin; else loggedInMobile">
          <button class="login-btn" (click)="navigateToLogin()">
            تسجيل الدخول
          </button>
        </ng-container>

        <ng-template #loggedInMobile>
          <div class="navbar__user" routerLink="/settings">
            <img
              [src]="userImage"
              alt="User"
              class="user-image"
            />
            <span>البروفايل</span>
          </div>
          <button class="login-btn logout" (click)="handleLogout()">
            تسجيل الخروج
          </button>
        </ng-template>
      </li>
    </ul>

    <!-- Actions for larger screens -->
    <div class="navbar__actions" *ngIf="!isSmallScreen">
      <ng-container *ngIf="!isLogin; else loggedInDesktop">
        <button class="login-btn" (click)="navigateToLogin()">
          تسجيل الدخول
        </button>
      </ng-container>

      <ng-template #loggedInDesktop>
        <div class="navbar__user" routerLink="/settings">
          <img [src]="userImage" alt="User" class="user-image" />
          <span>مرحبًا، {{ userName }}</span>
          <div class="notification-container">
            <i class="bi bi-bell notification"></i>
          </div>
        </div>
        <button class="login-btn" (click)="handleLogout()">تسجيل الخروج</button>
      </ng-template>
    </div>
  </div>
</nav>
