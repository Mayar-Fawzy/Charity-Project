<nav class="navbar" [ngClass]="{ hidden: isNavbarHidden }">
  <div class="navbar__container">
    <div class="navbar__brand">
      <span>العطاء</span>
      <img
        src="../../../assets/Images/image33.png"
        alt="شعار"
        class="navbar__logo"
      />
      <span>يـــــــد</span>
    </div>

    <ul class="navbar__menu">
      <li><a routerLink="/home" routerLinkActive="active">الرئيسية</a></li>
      <li><a routerLink="/home">من نحن</a></li>
      <li><a routerLink="/home">المشاريع</a></li>
      <li><a routerLink="/home">التبرعات</a></li>
      <li><a routerLink="/home">تواصل معنا</a></li>
    </ul>

    <div class="navbar__actions">
      <button class="login-btn" *ngIf="!isLoggedIn" (click)="login()">
        تسجيل الدخول / إنشاء حساب
      </button>

      <div class="navbar__user" *ngIf="isLoggedIn">
        <img [src]="userImage" alt="User" class="user-image" />
        <span>مرحبًا، {{ userName }}</span>

        <div class="notification-container">
          <i class="bi bi-bell notification"></i>
          <span class="notification-count" *ngIf="unreadNotifications > 0">
            {{ unreadNotifications }}
          </span>
        </div>

        <button class="logout-btn" (click)="logout()">تسجيل الخروج</button>
      </div>
    </div>
  </div>
</nav>
