<section class="notifications-container card p-4 shadow-sm rounded-4 pb-4">
  <h2 class="text-center text-warning mb-4 fs-3 fw-bold">الإشعارات</h2>

  <div class="d-flex gap-2 flex-wrap justify-content-center mb-4">
    <button class="btn btn-warning px-4">الكل</button>
    <button class="btn btn-outline-warning px-4">مهام جديدة</button>
    <button class="btn btn-outline-warning px-4">تبرعات جديدة</button>
    <button class="btn btn-outline-warning px-4">إشعارات هامة</button>
  </div>

  <div
  *ngFor="let notification of notifications"
  class="notification-item"
  [ngClass]="notification.bgClass"
>
  <div class="icon-circle" [ngClass]="notification.iconColor">
    <i [ngClass]="notification.icon"></i>
  </div>

  <div class="flex-grow-1">
    <div class="d-flex justify-content-between align-items-center flex-wrap mb-1">
      <div class="fw-semibold d-flex align-items-center gap-2">
        {{ notification.title }}
        <span class="badge badge-time">
          {{ notification.timeValue }}{{ notification.timeUnit }}
        </span>
      </div>
      <a href="#" class="text-primary small text-decoration-none">عرض التفاصيل</a>
    </div>
    <div class="text-muted">{{ notification.message }}</div>
  </div>
</div>

</section>
