<main class="payment-container">
  <section class="payment-box">
    <div class="payment-methods">
      <div class="method active">
        <i class="bi bi-credit-card-2-front"></i>
        <div>
          <h3>بطاقة ائتمان/خصم</h3>
          <p>أدخل تفاصيل بطاقتك (Visa، MasterCard، أو أي بطاقة دولية)</p>
        </div>
      </div>
    </div>
    <h2 class="title">حدد قيمة التبرع</h2>

    <div class="custom-amount">
      <input
        type="number"
        [(ngModel)]="amount"
        placeholder="مبلغ آخر"
        min="0"
        step="10"
        class="custom-input"
      />
    </div>

    <div class="secure-note">
      <i class="bi bi-shield-lock"></i> يجب أن يكون المبلغ لا يقل عن 26 جنيهًا
    </div>

    <form #paymentForm="ngForm" (ngSubmit)="submitPayment()">
      <div class="input-group">
        <div class="input-wrapper w-25">
          <label for="card-number-element">رقم البطاقة</label>
          <div id="card-number-element" class="form-control"></div>
        </div>
          <div class="input-row">
          <div class="input-wrapper w-25">
            <label for="card-expiry-element">تاريخ الانتهاء (MM/YY)</label>
            <div id="card-expiry-element" class="form-control"></div>
          </div>
          <div class="input-wrapper w-25">
            <label for="card-cvc-element">رمز التحقق (CVV)</label>
            <div id="card-cvc-element" class="form-control"></div>
          </div>
        </div>
        <div class="input-wrapper">
          <label for="card-holder">اسم صاحب البطاقة</label>
          <input
            id="card-holder"
            type="text"
            name="cardHolder"
            
             disabled
            class="form-control"
            [value]="cardHolder"
          />
        
        </div>
      
      </div>

      <div class="secure-labels">
        <span><i class="bi bi-lock-fill"></i> SSL آمن</span>
        <span><i class="bi bi-shield-lock"></i> متوافق مع PCI-DSS</span>
      </div>

      <button
        type="submit"
        class="donate-btn"
        [disabled]="!isFormValid() || isLoading"
      >
        <span *ngIf="!isLoading">تبرع الآن</span>
        <span *ngIf="isLoading">جاري الدفع...</span>
      </button>
    </form>

    <p class="terms">
      بالنقر على زر "تبرع الآن" فإنك توافق على <a href="#">الشروط والأحكام</a>
    </p>

    <div class="payment-status" *ngIf="paymentStatus">
      {{ paymentStatus }}
    </div>
  </section>
</main>
