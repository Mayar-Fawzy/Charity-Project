<section class="container profile-settings">
  <div class="row g-4 flex-row-reverse">
    <!-- صورة المستخدم -->
    <div class="col-md-6">
      <div class="bg-white shadow-sm rounded p-4 text-center">
        <div class="avatar-wrapper d-inline-block position-relative">
          <ng-container *ngIf="userImageUrl; else letterAvatar">
            <img
              [src]="userImageUrl"
              alt="صورة المستخدم"
              class="rounded-circle user-img"
            />
          </ng-container>

          <ng-template #letterAvatar>
            <div
              class="letter-avatar rounded-circle d-flex justify-content-center align-items-center text-white"
              [ngStyle]="{
                'background-color': getRandomColor(userFullName),
                width: '100px',
                height: '100px',
                fontSize: '36px'
              }"
            >
              {{ getFirstLetter() }}
            </div>
          </ng-template>
        </div>

        <!-- زر رفع الصورة -->
        <input
          type="file"
          #fileInput
          accept="image/*"
          hidden
          (change)="onImageSelected($event)"
          formControlName="imageUrl"
        />
        <button
          type="button"
          class="btn btn-warning w-100 mt-3"
          (click)="fileInput.click()"
        >
          <i class="bi bi-upload"></i> رفع صورة
        </button>

        <!-- زر حذف الصورة -->
        <button
          *ngIf="userImageUrl"
          type="button"
          class="btn btn-outline-danger w-100 mt-2"
          (click)="removeImage()"
        >
          <i class="bi bi-trash"></i> حذف الصورة
        </button>
      </div>
    </div>

    <!-- بيانات المستخدم -->
    <!-- بيانات المستخدم -->
<div class="col-md-6">
  <div class="bg-white shadow-sm rounded p-3">
    <h4 class="text-center mb-4 text-warning">تعديل المستخدم</h4>
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <!-- البيانات الشخصية -->
        <div class="col-md-6">
          <label class="form-label d-block text-end">الاسم الأول</label>
          <input type="text" formControlName="firstName" class="form-control" />
          <div
            class="error-message"
            *ngIf="
              profileForm.get('firstName')?.errors &&
              (profileForm.get('firstName')?.touched ||
                profileForm.get('firstName')?.dirty)
            "
          >
            <span *ngIf="profileForm.get('firstName')?.getError('required')"
              >الاسم مطلوب</span
            >
            <span
              *ngIf="profileForm.get('firstName')?.errors?.['minlength']"
              >يجب أن يكون أكثر من 3 حروف</span
            >
          </div>
        </div>
    
        <div class="col-md-6">
          <label class="form-label d-block text-end">اسم العائلة</label>
          <input type="text" formControlName="lastName" class="form-control" />
          <div
            class="error-message"
            *ngIf="
              profileForm.get('lastName')?.errors &&
              (profileForm.get('lastName')?.touched ||
                profileForm.get('lastName')?.dirty)
            "
          >
            <span *ngIf="profileForm.get('lastName')?.getError('required')"
              >الاسم مطلوب</span
            >
            <span *ngIf="profileForm.get('lastName')?.errors?.['minlength']"
              >يجب أن يكون أكثر من 3 حروف</span
            >
          </div>
        </div>
    
        <div class="col-md-6">
          <label class="form-label d-block text-end">البريد الإلكتروني</label>
          <input type="email" formControlName="email" class="form-control" />
          <div
            class="error-message"
            *ngIf="
              profileForm.get('email')?.errors &&
              (profileForm.get('email')?.touched || profileForm.get('email')?.dirty)
            "
          >
            <span *ngIf="profileForm.get('email')?.getError('required')"
              >البريد الإلكتروني مطلوب</span
            >
            <span *ngIf="profileForm.get('email')?.errors?.['email']"
              >البريد الإلكتروني غير صحيح</span
            >
          </div>
        </div>
    
        <div class="col-md-6">
          <label class="form-label d-block text-end">رقم الهاتف</label>
          <input type="text" formControlName="phoneNumber" class="form-control" />
          <div
            class="error-message"
            *ngIf="
              profileForm.get('phoneNumber')?.errors &&
              (profileForm.get('phoneNumber')?.touched ||
                profileForm.get('phoneNumber')?.dirty)
            "
          >
            <span
              *ngIf="profileForm.get('phoneNumber')?.getError('required')"
              >الرقم مطلوب</span
            >
            <span
              *ngIf="profileForm.get('phoneNumber')?.errors?.['pattern']"
              >يجب أن يكون 11 رقم</span
            >
          </div>
        </div>
    
        <!-- العنوان والنوع -->
        <div class="col-md-6">
          <label class="form-label d-block text-end">العنوان</label>
          <input type="text" formControlName="address" class="form-control" />
          <div
            class="error-message"
            *ngIf="
              profileForm.get('address')?.errors &&
              (profileForm.get('address')?.touched || profileForm.get('address')?.dirty)
            "
          >
            <span *ngIf="profileForm.get('address')?.getError('required')"
              >العنوان مطلوب</span
            >
            <span *ngIf="profileForm.get('address')?.getError('minlength')"
              >يجب أن يكون أكثر من 5 حروف</span
            >
          </div>
        </div>
    
        <div class="col-md-2">
          <label class="form-label d-block text-end">النوع</label>
          <select formControlName="gender" class="form-select no-arrow">
            <option [value]="0">ذكر</option>
            <option [value]="1">أنثى</option>
          </select>
        </div>
    
        <!-- العمر وتاريخ الميلاد -->
        <div class="col-md-2">
          <label class="form-label d-block text-end">العمر</label>
          <input
            type="number"
            formControlName="age"
            class="form-control text-center"
            [value]="profileForm.get('age')?.value"
          />
        </div>
    
        <div class="col-md-6">
          <label class="form-label d-block text-end">تاريخ الميلاد</label>
          <div
            class="d-flex justify-content-between gap-2 flex-row-reverse birthdate-display"
          >
            <div class="text-center flex-fill">
              <label class="form-label">اليوم</label>
              <input
                type="number"
                class="form-control text-center"
                [value]="day"
                disabled
              />
            </div>
            <div class="text-center flex-fill">
              <label class="form-label">الشهر</label>
              <input
                type="number"
                class="form-control text-center"
                [value]="month"
                disabled
              />
            </div>
            <div class="text-center flex-fill">
              <label class="form-label">السنة</label>
              <input
                type="number"
                class="form-control text-center"
                [value]="year"
                disabled
              />
            </div>
          </div>
        </div>
      </div>
    
      <div class="row mt-4">
        <div class="col">
          <button
            type="submit"
            class="btn btn-warning w-100"
            [disabled]="isLoading"
          >
            <span *ngIf="!isLoading">تحديث</span>
            <span *ngIf="isLoading">
              جاري التحميل...
              <i class="spinner-border spinner-border-sm me-1"></i>
            </span>
          </button>
        </div>
        <div class="col">
          <button
            type="button"
            class="btn btn-danger w-100"
            (click)="onCancel()"
          >
            إلغاء
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
  </div>
</section>
